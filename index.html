<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลอยกระทง · Loy Krathong</title>
<meta name="description" content="เขียนคำอธิษฐานแล้วลอยกระทงใต้พระจันทร์เต็มดวง ชมพลุและวัดริมแม่น้ำ">
<meta name="theme-color" content="#050b1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pridi:wght@400;600&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#fdf3dc;--gold:#f4c95d;--night:#050b1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);overflow:hidden;
  font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
header{position:fixed;top:max(16px,env(safe-area-inset-top));left:20px;right:20px;pointer-events:none;
  text-shadow:0 2px 12px rgba(0,0,0,.7)}
h1{margin:0;font:600 clamp(30px,6vw,56px)/1.1 'Pridi',serif;color:var(--gold);
  text-shadow:0 0 24px rgba(244,201,93,.45),0 2px 10px rgba(0,0,0,.7)}
.sub{margin:6px 0 0;font-size:clamp(14px,2.2vw,17px);opacity:.92;max-width:34em}
.credit{margin:8px 0 0;font-size:12px;opacity:.6}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));
  width:min(580px,calc(100% - 28px));display:flex;gap:10px;padding:12px;border-radius:16px;
  background:rgba(8,14,34,.74);border:1px solid rgba(244,201,93,.35);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#wish{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.07);
  border:1px solid rgba(253,243,220,.25);border-radius:10px;padding:11px 13px}
#wish::placeholder{color:rgba(253,243,220,.55)}
button{font:600 16px 'Sarabun',sans-serif;color:#2a1a05;background:var(--gold);border:0;border-radius:10px;
  padding:0 20px;cursor:pointer;white-space:nowrap}
button:hover{background:#ffdc7d}
:is(input,button):focus-visible{outline:2px solid #fff;outline-offset:2px}
#msg{position:absolute;left:0;right:0;bottom:calc(100% + 104px);text-align:center;font-size:15px;
  text-shadow:0 1px 8px #000;min-height:1.4em;pointer-events:none}
#count{position:fixed;right:20px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px);font-size:13px;opacity:.75;
  text-shadow:0 1px 6px #000;pointer-events:none}
#tip{position:fixed;left:0;top:0;display:none;max-width:240px;padding:8px 12px;border-radius:10px;
  font:400 15px/1.45 'Pridi','Sarabun',serif;background:rgba(10,18,40,.86);border:1px solid rgba(244,201,93,.5);
  transform:translate(-50%,-100%);pointer-events:none;z-index:5;text-align:center}
@media (max-width:520px){#count{display:none}button{padding:0 14px}}
</style>
</head>
<body>
<canvas id="c" aria-label="ภาพแม่น้ำยามค่ำคืนวันลอยกระทง มีพระจันทร์เต็มดวง วัด หมู่บ้านไทย พลุ และกระทงลอยอยู่บนน้ำ" role="img"></canvas>
<header>
  <h1>ลอยกระทง</h1>
  <p class="sub">เขียนคำอธิษฐาน แล้วปล่อยให้สายน้ำพาไป · แตะท้องฟ้าเพื่อจุดพลุ · แตะกระทงเพื่ออ่านคำอธิษฐาน</p>
  <p class="credit">สร้างโดย Claude · Anthropic</p>
</header>
<div id="count" aria-live="off"></div>
<form id="panel" autocomplete="off">
  <div id="msg" aria-live="polite"></div>
  <input id="wish" maxlength="80" placeholder="พิมพ์คำอธิษฐานของคุณ" aria-label="คำอธิษฐาน">
  <button type="submit">ลอยกระทง</button>
</form>
<div id="tip" role="status"></div>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center">ต้องเปิด JavaScript เพื่อชมเว็บไซต์นี้</p></noscript>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const tip=document.getElementById('tip'),msg=document.getElementById('msg'),
      cnt=document.getElementById('count'),form=document.getElementById('panel'),inp=document.getElementById('wish');
const rnd=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,HZ,U,SM,KM,bg,MX,MY,MR,yMin,yMax,panelTop,pk,stars=[],ripples=[];

/* ---------- ฉากหลัง (วาดครั้งเดียวลงแคนวาสสำรอง) ---------- */
function house(c,x,s,refl){
  c.save();c.translate(x,HZ-3*U);c.scale(s*SM*U,s*SM*U);
  c.fillStyle='#091125';
  for(const px of[-34,-12,12,34])c.fillRect(px-1.5,-22,3,22);
  c.fillRect(-40,-56,80,36);
  c.beginPath();c.moveTo(-56,-54);c.lineTo(-27,-98);c.lineTo(27,-98);c.lineTo(56,-54);c.closePath();c.fill();
  c.beginPath();c.moveTo(-27,-98);c.lineTo(-36,-111);c.lineTo(-22,-100);c.moveTo(27,-98);c.lineTo(36,-111);c.lineTo(22,-100);c.fill();
  c.strokeStyle='rgba(120,150,220,.35)';c.lineWidth=1.5;c.beginPath();c.moveTo(-56,-54);c.lineTo(-27,-98);c.lineTo(27,-98);c.lineTo(56,-54);c.stroke();
  c.fillStyle='#ffc45e';c.fillRect(-28,-48,14,16);c.fillRect(14,-48,14,16);
  c.restore();refl(x,46*s*SM,'255,190,90',.2);
}
function temple(c,x,s,refl){
  c.save();c.translate(x,HZ-3*U);c.scale(s*SM*U,s*SM*U);
  c.fillStyle='#091125';c.fillRect(-100,-14,200,14);c.fillRect(-90,-26,180,12);c.fillRect(-76,-70,152,46);
  c.fillStyle='#ffc45e';
  for(const wx of[-58,-34,24,48])c.fillRect(wx,-62,10,26);
  c.fillStyle='#ffdf9a';c.fillRect(-9,-62,18,36);
  c.fillStyle='#0b1428';
  c.beginPath();c.moveTo(-110,-78);c.quadraticCurveTo(-94,-70,-80,-70);c.lineTo(80,-70);c.quadraticCurveTo(94,-70,110,-78);c.lineTo(84,-98);c.lineTo(-84,-98);c.closePath();c.fill();
  c.beginPath();c.moveTo(-90,-98);c.quadraticCurveTo(-76,-92,-62,-92);c.lineTo(62,-92);c.quadraticCurveTo(76,-92,90,-98);c.lineTo(66,-120);c.lineTo(-66,-120);c.closePath();c.fill();
  c.strokeStyle='rgba(244,201,93,.85)';c.lineWidth=2.2;c.lineJoin='round';
  c.beginPath();c.moveTo(-110,-78);c.quadraticCurveTo(-94,-70,-80,-70);c.lineTo(80,-70);c.quadraticCurveTo(94,-70,110,-78);c.lineTo(84,-98);c.lineTo(-84,-98);c.lineTo(-110,-78);
  c.moveTo(-90,-98);c.quadraticCurveTo(-76,-92,-62,-92);c.lineTo(62,-92);c.quadraticCurveTo(76,-92,90,-98);c.lineTo(66,-120);c.lineTo(-66,-120);c.lineTo(-90,-98);c.stroke();
  c.fillStyle='#e8c466';
  for(const sx of[-1,1]){c.beginPath();c.moveTo(sx*66,-120);c.lineTo(sx*80,-136);c.lineTo(sx*58,-124);c.fill();
    c.beginPath();c.moveTo(sx*84,-98);c.lineTo(sx*98,-112);c.lineTo(sx*76,-100);c.fill();}
  c.restore();refl(x,170*s*SM,'255,200,100',.26);
}
function chedi(c,x,s,refl){
  c.save();c.translate(x,HZ-3*U);c.scale(s*SM*U,s*SM*U);
  const g=c.createLinearGradient(0,-170,0,0);g.addColorStop(0,'#ffe9a0');g.addColorStop(.6,'#c9a24a');g.addColorStop(1,'#5f4519');
  c.fillStyle=g;
  c.fillRect(-44,-12,88,12);c.fillRect(-36,-24,72,12);c.fillRect(-28,-34,56,10);
  c.beginPath();c.moveTo(-26,-34);c.bezierCurveTo(-26,-70,-12,-86,-6,-110);c.lineTo(6,-110);c.bezierCurveTo(12,-86,26,-70,26,-34);c.fill();
  c.beginPath();c.moveTo(-6,-108);c.lineTo(0,-172);c.lineTo(6,-108);c.fill();
  c.beginPath();c.arc(0,-174,3,0,TAU);c.fill();
  c.strokeStyle='rgba(60,40,10,.45)';c.lineWidth=1.2;
  for(const y of[-48,-62,-76,-90]){c.beginPath();c.moveTo(-22+(y+34)*-.12,y);c.lineTo(22-(y+34)*-.12,y);c.stroke();}
  c.restore();refl(x,70*s*SM,'255,215,120',.3);
}
function palm(c,x,s){
  c.save();c.translate(x,HZ-3*U);c.scale(s*SM*U,s*SM*U);
  c.strokeStyle='#070d1f';c.lineCap='round';c.lineWidth=6;
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(6,-60,14,-118);c.stroke();
  c.lineWidth=3;
  for(const [ex,ey] of[[-48,-96],[-34,-132],[-4,-146],[40,-138],[60,-100],[36,-92]]){
    c.beginPath();c.moveTo(14,-118);c.quadraticCurveTo(14+ex*.5,-118+(ey+118)-26,14+ex,-118+(ey+118)+30);c.stroke();}
  c.restore();
}
function buildBG(){
  bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;
  const c=bg.getContext('2d');c.scale(DPR,DPR);
  let g=c.createLinearGradient(0,0,0,HZ);
  g.addColorStop(0,'#03060f');g.addColorStop(.55,'#0a1536');g.addColorStop(1,'#2a3a70');
  c.fillStyle=g;c.fillRect(0,0,W,HZ);
  g=c.createRadialGradient(MX,MY,MR*.8,MX,MY,MR*6);
  g.addColorStop(0,'rgba(255,240,190,.4)');g.addColorStop(1,'rgba(255,240,190,0)');
  c.fillStyle=g;c.fillRect(0,0,W,HZ);
  g=c.createRadialGradient(MX-MR*.3,MY-MR*.3,MR*.1,MX,MY,MR);
  g.addColorStop(0,'#fffdf0');g.addColorStop(1,'#f4e3ae');
  c.fillStyle=g;c.beginPath();c.arc(MX,MY,MR,0,TAU);c.fill();
  c.fillStyle='rgba(190,165,110,.2)';
  for(const [a,b,r] of[[-.3,-.1,.22],[.25,.2,.3],[.05,-.5,.14],[-.15,.45,.16],[.5,-.3,.1]]){c.beginPath();c.arc(MX+a*MR,MY+b*MR,r*MR,0,TAU);c.fill();}
  // แนวต้นไม้ไกล
  c.fillStyle='#070d1f';c.beginPath();c.moveTo(0,HZ);
  for(let x=0;x<=W+10;x+=8)c.lineTo(x,HZ-(9+Math.sin(x*.045)*4+Math.sin(x*.13)*3+Math.sin(x*.31)*1.5)*U*SM);
  c.lineTo(W,HZ+2);c.lineTo(0,HZ+2);c.fill();
  // น้ำ
  g=c.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#16254f');g.addColorStop(.35,'#091330');g.addColorStop(1,'#040812');
  c.fillStyle=g;c.fillRect(0,HZ,W,H-HZ);
  const refl=(x,w,rgb,a)=>{const h=(H-HZ)*.32;const gg=c.createLinearGradient(0,HZ,0,HZ+h);
    gg.addColorStop(0,`rgba(${rgb},${a})`);gg.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=gg;c.fillRect(x-w/2,HZ,w,h);};
  for(const x of[.02,.17,.62,.74,.97])palm(c,W*x,1);
  for(const [x,s] of[[.08,1],[.14,.8],[.51,.9],[.58,1.1],[.67,.85],[.84,1],[.91,.8]])house(c,W*x,s,refl);
  temple(c,W*.29,1.1,refl);chedi(c,W*.45,1.15,refl);
  for(const x of[.12,.55,.78,.95])palm(c,W*x,.8);
}

/* ---------- พลุ ---------- */
const PAL=[['#ff5e7e','#ffd1dc'],['#ffd24a','#fff0b0'],['#5ee0ff','#c8f4ff'],['#9d7bff','#e0d4ff'],['#6bffb0','#d0ffe8'],['#ff9a3c','#ffe0b8']];
const rockets=[],parts=[],flashes=[];
function addRocket(tx,ty){
  rockets.push({x0:rnd(W*.2,W*.8),y0:HZ-6,tx,ty:Math.max(50,Math.min(ty,HZ-60)),u:0,dur:rnd(.8,1.2),pal:PAL[(Math.random()*PAL.length)|0],x:0,y:HZ});
}
function explode(x,y,pal){
  const T=['peony','ring','willow','heart','burst'][(Math.random()*5)|0];
  flashes.push({x,y,a:1,c:pal[0]});
  const n=T==='ring'?72:T==='heart'?84:110,sp=rnd(130,210)*Math.max(.75,Math.min(1.3,U*SM));
  for(let i=0;i<n&&parts.length<2200;i++){
    let vx,vy,col=pal[i%3?0:1],life=rnd(1.2,1.9),g=70,drag=.965,a=rnd(0,TAU),s;
    if(T==='peony'){s=sp*rnd(.3,1);vx=Math.cos(a)*s;vy=Math.sin(a)*s;}
    else if(T==='ring'){a=i/n*TAU;vx=Math.cos(a)*sp;vy=Math.sin(a)*sp;}
    else if(T==='willow'){s=sp*rnd(.3,.9);vx=Math.cos(a)*s;vy=Math.sin(a)*s;col='#ffd88a';life=rnd(2,3);g=95;drag=.975;}
    else if(T==='heart'){a=i/n*TAU;const k=sp/17;vx=16*Math.pow(Math.sin(a),3)*k;
      vy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*k;g=25;drag=.97;col=pal[0];}
    else{s=i%2?sp:sp*.55;vx=Math.cos(a)*s;vy=Math.sin(a)*s;col=i%2?pal[0]:pal[1];}
    parts.push({x,y,px:x,py:y,vx,vy,life,max:life,col,g,drag,sz:rnd(1.2,2.2)});
  }
}
function stepFireworks(dt){
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.u+=dt/r.dur;const e=1-Math.pow(1-Math.min(r.u,1),2);
    r.x=r.x0+(r.tx-r.x0)*e;r.y=r.y0+(r.ty-r.y0)*e;
    parts.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:rnd(-8,8),vy:rnd(10,30),life:.45,max:.45,col:'#ffd9a0',g:0,drag:.9,sz:1.4});
    if(r.u>=1){explode(r.tx,r.ty,r.pal);rockets.splice(i,1);}
  }
  const f=Math.pow;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;if(p.life<=0||p.y>HZ){parts.splice(i,1);continue;}
    p.px=p.x;p.py=p.y;const d=f(p.drag,dt*60);p.vx*=d;p.vy=p.vy*d+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=flashes.length-1;i>=0;i--){flashes[i].a-=dt*1.8;if(flashes[i].a<=0)flashes.splice(i,1);}
}
function drawFireworks(){
  ctx.globalCompositeOperation='lighter';
  const R=300*Math.max(.7,U*SM);
  for(const f of flashes){
    let g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,R);g.addColorStop(0,f.c);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=f.a*.2;ctx.fillStyle=g;ctx.fillRect(f.x-R,f.y-R,R*2,R*2);
    const wy=HZ+(HZ-f.y)*.5;g=ctx.createRadialGradient(f.x,wy,0,f.x,wy,R*.8);g.addColorStop(0,f.c);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=f.a*.12;ctx.fillStyle=g;ctx.fillRect(f.x-R,wy-R*.5,R*2,R);
  }
  ctx.lineCap='round';
  for(const p of parts){
    let a=Math.max(0,p.life/p.max);if(a<.35&&Math.random()<.4)a*=.4;
    ctx.strokeStyle=p.col;ctx.lineWidth=p.sz;ctx.globalAlpha=a;
    ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.globalAlpha=a*.2;ctx.beginPath();
    ctx.moveTo(p.px+rnd(-2,2),HZ+(HZ-p.py)*.5);ctx.lineTo(p.x+rnd(-2,2),HZ+(HZ-p.y)*.5);ctx.stroke();
  }
  for(const r of rockets){ctx.globalAlpha=1;ctx.fillStyle='#fff6d8';ctx.beginPath();ctx.arc(r.x,r.y,2.2,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ---------- กระทง ---------- */
const WISHES=['ขอบคุณแม่คงคา ขออโหสิกรรมที่เคยล่วงเกิน','ขอให้ครอบครัวมีสุขภาพแข็งแรง','ขอให้สมหวังในสิ่งที่ตั้งใจไว้','ขอให้โลกนี้สงบสุข','ขอให้มีแต่รอยยิ้มและความสุข','ขอให้การงานก้าวหน้า มีโชคมีลาภ','ขอให้ได้เจอคนที่ใช่','ขอให้ทุกวันเป็นวันที่ดี'];
const KP=[['#f78fb3','#ffd1e3'],['#f3f0ff','#ffffff'],['#d6336c','#ff9ec4'],['#b197fc','#e5dbff'],['#ffa94d','#ffe8cc']];
const ks=[];let time=0,tipK=null,tipUntil=0,hoverK=null;
function bounds(){
  yMin=HZ+(H-HZ)*.13;panelTop=form.getBoundingClientRect().top;yMax=panelTop-125;if(yMax<yMin+30)yMax=yMin+30;
}
function makeK(wish,fresh){
  return{x:fresh?rnd(W*.25,W*.75):rnd(0,W),y:fresh?yMax-rnd(0,15):rnd(yMin,yMax),wish,pal:KP[(Math.random()*KP.length)|0],
    ph1:rnd(0,TAU),ph2:rnd(0,TAU),f1:rnd(.15,.4),f2:rnd(.1,.3),a1:rnd(6,16),a2:rnd(3,8),born:fresh?time:-9,k:1,by:0,flight:null};
}
function newPreview(){const o=makeK('',false);o.born=time+.7;o.x=W/2;o.y=panelTop-30;return o;}
function stepK(o,dt){
  if(o.flight){const f=o.flight,u=Math.min(1,(time-f.t0)/f.dur),e=u*u*(3-2*u),kt=(.45+(f.ty-HZ)/(H-HZ)*1.2)*KM;
    o.x=f.x0+(f.tx-f.x0)*e;o.y=f.y0+(f.ty-f.y0)*e-Math.sin(Math.PI*u)*140;o.k=f.k0+(kt-f.k0)*e;
    if(u>=1)o.flight=null;return;}
  const vx=10+Math.sin(time*o.f1+o.ph1)*o.a1;let vy=Math.sin(time*o.f2+o.ph2)*o.a2;
  if(o.y<yMin)vy+=18;if(o.y>yMax)vy-=18;
  o.x+=vx*dt;o.y+=vy*dt;if(o.x>W+90)o.x=-90;if(o.x<-90)o.x=W+90;
  o.k=(.45+(o.y-HZ)/(H-HZ)*1.2)*KM;
}
function petal(a,r,sz,pal){
  const bx=Math.cos(a)*r,by=Math.sin(a)*r*.36;
  ctx.save();ctx.translate(bx,by-sz*.55);ctx.rotate(Math.cos(a)*.55);
  const g=ctx.createLinearGradient(0,sz,0,-sz);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);
  ctx.fillStyle=g;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=.7;
  ctx.beginPath();ctx.ellipse(0,0,sz*.42,sz,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore();
}
function ring(n,off,front,fn){for(let i=0;i<n;i++){const a=i/n*TAU+off;if((Math.sin(a)>=0)===front)fn(a);}}
function drawK(o){
  const age=Math.max(0,Math.min(1,(time-o.born)/1)),k=o.k*(1+(1-age)*.5);
  const bob=Math.sin(time*1.6+o.ph1)*1.6*k;o.by=bob;
  ctx.save();ctx.translate(o.x,o.y+bob);ctx.rotate(Math.sin(time*1.1+o.ph2)*.05);ctx.scale(k,k);ctx.globalAlpha=age;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,9,42,11,0,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  let g=ctx.createRadialGradient(0,2,4,0,2,95);g.addColorStop(0,'rgba(255,170,70,.32)');g.addColorStop(1,'rgba(255,170,70,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,6,95,34,0,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#ead9a6';ctx.beginPath();ctx.ellipse(0,0,37,12.5,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#b9a46a';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,26,8,0,0,TAU);ctx.stroke();
  const leaf=a=>{ctx.save();ctx.translate(Math.cos(a)*35,Math.sin(a)*11.5);ctx.rotate(a*.4);ctx.fillStyle='#3f9150';
    ctx.beginPath();ctx.ellipse(0,0,9,3.6,Math.sin(a)*.5,0,TAU);ctx.fill();ctx.restore();};
  const gold=a=>{ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.arc(Math.cos(a)*31,Math.sin(a)*10.5-1,3,0,TAU);ctx.fill();};
  ring(14,0,false,leaf);ring(12,.2,false,gold);
  ring(10,.15,false,a=>petal(a,25,15,o.pal));ring(8,.4,false,a=>petal(a,14,13,o.pal));
  ctx.fillStyle='#fff3d0';ctx.fillRect(-2.5,-24,5,22);
  ctx.strokeStyle='#7a2b1b';ctx.lineWidth=1.1;
  for(const s of[-1,0,1]){ctx.beginPath();ctx.moveTo(s*5,-6);ctx.lineTo(s*14,-36);ctx.stroke();}
  const fl=Math.sin(time*11+o.ph1)*1.2+Math.sin(time*17+o.ph2)*.8;
  ctx.globalCompositeOperation='lighter';
  g=ctx.createRadialGradient(0,-30,1,0,-30,38);g.addColorStop(0,'rgba(255,190,90,.55)');g.addColorStop(1,'rgba(255,150,40,0)');
  ctx.fillStyle=g;ctx.fillRect(-40,-70,80,80);ctx.globalCompositeOperation='source-over';
  g=ctx.createLinearGradient(0,-38,0,-24);g.addColorStop(0,'#fff2a8');g.addColorStop(1,'#ff9a2a');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-39-fl);ctx.quadraticCurveTo(4.6,-30,0,-24.5);ctx.quadraticCurveTo(-4.6,-30,0,-39-fl);ctx.fill();
  ring(8,.4,true,a=>petal(a,14,13,o.pal));ring(10,.15,true,a=>petal(a,25,15,o.pal));
  ring(12,.2,true,gold);ring(14,0,true,leaf);
  ctx.restore();
}

/* ---------- ท้องน้ำ / ดวงดาว ---------- */
function drawWater(){
  ctx.fillStyle='#fff3c8';
  for(let i=0;i<46;i++){
    const t=i/46,y=HZ+t*(H-HZ)*.92+2,w=MR*(.35+t*1.3)*(.45+.55*Math.abs(Math.sin(time*1.3+i*1.7)));
    ctx.globalAlpha=.5*(1-t*.75);ctx.fillRect(MX+Math.sin(time*.9+i*.8)*(4+t*20)-w/2,y,w,1.5+t*2.5);
  }
  ctx.fillStyle='#8fa8e0';
  for(const r of ripples){
    const y=HZ+Math.pow(r.t,1.5)*(H-HZ),len=10+r.t*60,x=((r.x+time*r.s*(.3+r.t))%(W+120))-60;
    ctx.globalAlpha=.1+r.t*.12;ctx.fillRect(x,y+Math.sin(time*1.4+r.x)*1.2,len,1);
  }
  ctx.globalAlpha=1;
}
function drawStars(){
  ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=.35+.65*Math.abs(Math.sin(time*s.s+s.p));
    const dx=s.x-MX,dy=s.y-MY;if(dx*dx+dy*dy<MR*MR*9)ctx.globalAlpha*=.25;ctx.fillRect(s.x,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
}

/* ---------- วงจรหลัก ---------- */
let last=performance.now(),nextFw=1;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(bg,0,0,W,H);
  drawStars();stepFireworks(dt);drawFireworks();drawWater();
  nextFw-=dt;if(nextFw<=0){addRocket(rnd(W*.1,W*.9),rnd(HZ*.12,HZ*.5));if(Math.random()<.3)setTimeout(()=>addRocket(rnd(W*.1,W*.9),rnd(HZ*.12,HZ*.5)),300);
    nextFw=reduce?rnd(7,11):rnd(1.4,3.4);}
  for(const o of ks)stepK(o,dt);
  [...ks].sort((a,b)=>a.y-b.y).forEach(drawK);
  if(pk){pk.x=W/2;pk.y=panelTop-30;pk.k=Math.min(1.7,Math.max(1.25,KM*1.4));drawK(pk);}
  const t=hoverK||(time<tipUntil?tipK:null);
  if(t&&ks.includes(t)){tip.style.display='block';
    tip.style.left=Math.max(130,Math.min(W-130,t.x))+'px';tip.style.top=(t.y+t.by-70*t.k)+'px';
  }else tip.style.display='none';
  requestAnimationFrame(frame);
}
function pick(x,y){
  let best=null,bd=1e9;
  for(const o of ks){const dx=x-o.x,dy=y-(o.y-12*o.k),d=Math.hypot(dx,dy);if(d<46*o.k&&d<bd){bd=d;best=o;}}
  return best;
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  HZ=Math.round(H*(W<H?.5:.56));U=Math.min(W,H*1.5)/900;SM=W<H?1.5:1;KM=Math.min(1.35,Math.max(.8,U));
  MX=W*(W<H?.74:.8);MY=HZ*.3;MR=Math.max(34,Math.min(W,H)*.085);
  stars=Array.from({length:Math.round(W*HZ/5000)},()=>({x:rnd(0,W),y:rnd(0,HZ*.9),r:rnd(.8,2),p:rnd(0,TAU),s:rnd(.8,2.5)}));
  ripples=Array.from({length:70},()=>({x:rnd(0,W),t:Math.random(),s:rnd(6,16)}));
  buildBG();bounds();
}
function updateCount(){cnt.textContent='กระทงบนสายน้ำ '+ks.length+' ดวง';}
cv.addEventListener('pointerdown',e=>{
  const o=pick(e.clientX,e.clientY);
  if(o){tipK=o;tipUntil=time+5;}
  else if(e.clientY<HZ+30)addRocket(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{hoverK=e.pointerType==='mouse'?pick(e.clientX,e.clientY):null;cv.style.cursor=hoverK?'pointer':'';});
let msgTimer;
form.addEventListener('submit',e=>{
  e.preventDefault();const text=inp.value.trim();
  clearTimeout(msgTimer);
  if(!text){msg.textContent='พิมพ์คำอธิษฐานก่อน แล้วกดลอยกระทง';inp.focus();msgTimer=setTimeout(()=>msg.textContent='',3500);return;}
  const k=pk;pk=newPreview();k.wish=text;k.born=-9;
  k.flight={t0:time,dur:1.8,x0:k.x,y0:k.y,k0:k.k,tx:rnd(W*.2,W*.8),ty:rnd(yMin,yMax)};
  ks.push(k);if(ks.length>45)ks.shift();
  tipK=k;tipUntil=time+9;inp.value='';updateCount();
  [1200,1450,1750].forEach(d=>setTimeout(()=>addRocket(rnd(W*.15,W*.85),rnd(HZ*.12,HZ*.5)),d));
  msg.textContent='กระทงของคุณลอยไปแล้ว ขอให้สมหวัง';msgTimer=setTimeout(()=>msg.textContent='',4500);
});
addEventListener('resize',resize);
resize();
pk=newPreview();pk.born=0;
for(let i=0;i<8;i++)ks.push(makeK(WISHES[i%WISHES.length],false));
updateCount();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(bounds);
requestAnimationFrame(frame);
})();
</script>
